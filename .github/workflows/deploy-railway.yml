# Redeploy on push when GitHub Secrets are configured.
#
# Required:
#   RAILWAY_TOKEN — Project Settings → Tokens (project token, not account token)
#
# Optional:
#   RAILWAY_SERVICE_ID — service name or id (defaults to gapgapgap)
name: Deploy Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Railway token
        id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN secret missing — relying on Railway GitHub autodeploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.check.outputs.skip == 'false'
        # Pin: newer CLI versions have broken project-token auth in CI.
        run: npm install -g @railway/cli@5.2.0

      - name: Deploy
        if: steps.check.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          SERVICE="${RAILWAY_SERVICE_ID:-gapgapgap}"
          echo "Railway status:"
          railway status || true
          echo "Deploying service: $SERVICE"

          set +e
          railway up --ci --service "$SERVICE"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Deployed via railway up --ci"
            exit 0
          fi

          echo "CI wait/stream failed (exit=$code); retrying without --ci"
          railway up --service "$SERVICE"
          echo "Deploy uploaded via railway up"
